name: great_quran
description: Great Quran.

publish_to: "none"
version: 1.4.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter_spinkit: ^5.2.1
  flutter_staggered_grid_view: ^0.7.0

  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  json_annotation: ^4.9.0

  hooks_riverpod: ^2.5.1
  go_router: ^14.2.0

  audioplayers: ^6.0.0
  clipboard: ^0.1.3
  share_plus: ^9.0.0
  intl: ^0.20.2
  url_launcher: ^6.2.6
  in_app_review: ^2.0.9
  location: ^5.0.3

  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3
  flutter_timezone: ^3.0.1

  fluttertoast: ^8.2.5
  flutter_compass: ^0.8.0

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  watcher: ^1.1.0
  win32: ^5.5.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/json/
    - assets/fonts/
    - assets/new_logo.png

  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs_V20.ttf

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/new_logo.png
  android_gravity: center
